name: Keep Supabase Alive

# Supabase free pauses the project after ~7 days without database activity.
# We call the RPC public.ping() daily to avoid it. Daily (not weekly) gives
# margin in case GH Actions delays a run under free-tier load.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          status=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          [ "$status" = "200" ]
